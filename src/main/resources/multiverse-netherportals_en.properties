# Link command
mv-netherportals.link.description=Sets the destination world for Nether or End portals.
mv-netherportals.link.type.description=Portal type to link.
mv-netherportals.link.fromworld.description=World containing the portals.
mv-netherportals.link.toworld.description=World the portals should lead to.
mv-netherportals.link.failed=&cThere was an error creating the portal link.\n&cError: {error}
mv-netherportals.link.disabled=&aSuccessfully &cdisabled &f{linkType} &aportals in world '&6{world}&f'.
mv-netherportals.link.success=&aThe &f{linkType}&a portals in '&f{fromWorld}&a' are now linked to '&f{toWorld}&a'.

# Unlink command
mv-netherportals.unlink.description=Removes a Nether or End portal link from a world.
mv-netherportals.unlink.type.description=Portal type to unlink.
mv-netherportals.unlink.fromworld.description=World containing the portals.
mv-netherportals.unlink.notlinked=&cThe world '&f{world}&c' does not have a {linkType} portal link.
mv-netherportals.unlink.failed=&cThere was an error removing the portal link.\n&cError: {error}
mv-netherportals.unlink.enabled=&aSuccessfully enabled &f{linkType}&a portals in world '&f{world}&a'.
mv-netherportals.unlink.success=&aThe &f{linkType}&a portals in '&f{fromWorld}&a' are now unlinked from '&f{toWorld}&a'.

# List command
mv-netherportals.list.description=Displays all configured portal links.
mv-netherportals.list.type.description=Portal type to list.
mv-netherportals.list.header.all=&6====[ All Portal Links ]====
mv-netherportals.list.header=&6====[ {linkType} Portal Links ]====
mv-netherportals.list.nocontent.all=&cNo portal links found.
mv-netherportals.list.nocontent=&cNo {linkType} portal links found.

# Portal use
mv-netherportals.portal.disabled=&c{linkType} portals are disabled in this world.
mv-netherportals.portal.nodestination=&cThis portal has no destination.
mv-netherportals.portal.autolinkedworld.notfound=&cNo {linkType} world is linked to this world, and the automatically selected world '&f{world}&c' does not exist or is not loaded.
